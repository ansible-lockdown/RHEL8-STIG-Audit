---

{{ if .Vars.RHEL_08_010287 }}
command:
  sshd_crypto_policy_not_overridden:
    title: RHEL-08-010287 | The RHEL 8 SSH daemon must be configured to use systemwide crypto policies.
    exec: grep -s CRYPTO_POLICY /etc/sysconfig/sshd
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^\s*CRYPTO_POLICY=/'
    meta:
      Cat: 1
      CCI: CCI-001453
      NIST800-53R4: AC-17
      Group_Title:
      - SRG-OS-000250-GPOS-00093
      - SRG-OS-000393-GPOS-00173
      - SRG-OS-000394-GPOS-00174
      - SRG-OS-000125-GPOS-00065
      Rule_ID: SV-288830r1261891_rule
      STIG_ID: RHEL-08-010287
      Vul_ID: V-288830
{{ end }}
