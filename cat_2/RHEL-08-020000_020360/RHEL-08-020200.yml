---

{{ if .Vars.RHEL_08_020200 }}
command:
  login_defs_pass_max:
    title: RHEL-08-020200 | RHEL 8 user account passwords must have a 180-day maximum password lifetime restriction.
    exec: grep -i pass_max /etc/login.defs
    exit-status: 0
    stdout:
    - '/^PASS_MAX_DAYS ([1-9]|[1-9][0-9]|1[0-7][0-9]|180)$/'
    - '!/^PASS_MAX_DAYS (18[1-9]|19[0-9]|[2-9][0-9][0-9]|[0-9]{4,})$/'
    meta:
      Cat: 2
      CCI: CCI-000199
      NIST800-53R4: IA-5
      Group_Title: SRG-OS-000076-GPOS-00044
      Rule_ID: SV-230366r1262169_rule
      STIG_ID: RHEL-08-020200
      Vul_ID: V-230366
{{ end }}
